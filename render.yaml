# Render Blueprint for 掌心窗公开版 v0.4.0 (single-process Python)
# 一键部署只创建【一个】服务：REST API + MCP + SQLite 全部由 8513 端口的 Python 进程接管。
# 彻底移除旧的 Node.js MCP 服务(8787)，消除多进程撕裂、MODULE_NOT_FOUND、端口冲突。
# 部署后：
# - 手机 App / 网页前端：填本服务的外部地址（如 https://xxx.onrender.com）。
# - AI(MCP) 客户端：填本服务地址 + /mcp（Streamable HTTP）或 /sse（SSE）。
#   两者是同一个进程、同一个端口，不再需要单独的 MCP 域名与 LINJIAN_URL。

services:
  - type: web
    name: zhangxinchuang-server
    runtime: python
    plan: free
    rootDir: server
    buildCommand: echo ok
    startCommand: python linjian_server.py
    envVars:
      - key: LINJIAN_TOKEN
        generateValue: true
      - key: LINJIAN_DEFAULT_DEVICE
        value: android-phone
      - key: LINJIAN_HOST
        value: 0.0.0.0
      - key: LINJIAN_KEEP
        value: 3
      # PORT 由 Render 注入；本地/自建用 LINJIAN_PORT=8513（见 start.sh）。
